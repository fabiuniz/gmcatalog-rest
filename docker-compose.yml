services:

  app:
    build: .
    container_name: gmcatalog-app
    ports:
      - "8080:8080"
    environment:
      - APP_PROFILE=dev
      - DB_URL=jdbc:postgresql://pg-docker:5432/gmcatalog
      - DB_USERNAME=postgres
      - DB_PASSWORD=1234567
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      - pg-docker
    networks:
      - dev-network
    restart: on-failure
     
  pg-docker:
    image: postgres:14-alpine
    container_name: dev-postgresql
    environment:
      POSTGRES_DB: gmcatalog
      POSTGRES_PASSWORD: 1234567
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create.sql:/docker-entrypoint-initdb.d/create.sql
    networks:
      - dev-network

  pgadmin-docker:
    image: dpage/pgadmin4
    container_name: dev-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: me@example.com
      PGADMIN_DEFAULT_PASSWORD: 1234567
    ports:
      - 5050:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin  # <--- Usa volume nomeado do Docker
    depends_on:
      - pg-docker
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: