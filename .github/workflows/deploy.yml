name: Deploy to Google Cloud Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo da execução manual (opcional)'
        required: false
        default: 'Execução manual'    

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: gmcatalog-rest
  # Formato correto do Artifact Registry: REGIAO-docker.pkg.dev/PROJECT_ID/REPOSITORY/IMAGE
  IMAGE_URL: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gmcatalog-rest/gmcatalog-rest

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Grant execute permission for Maven Wrapper
      run: chmod +x mvnw

    - name: Run tests
      run: ./mvnw clean test

  deploy-database:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Create Cloud SQL instance (if not exists)
      continue-on-error: true
      run: |
        gcloud sql instances create gmcatalog-db \
          --database-version=POSTGRES_14 \
          --tier=db-f1-micro \
          --region=$GCP_REGION \
          --storage-type=SSD \
          --storage-size=10GB

    - name: Create database (if not exists)
      continue-on-error: true
      run: |
        gcloud sql databases create gmcatalog --instance=gmcatalog-db

    - name: Set database user password
      continue-on-error: true
      run: |
        gcloud sql users set-password postgres \
          --host=% \
          --instance=gmcatalog-db \
          --password=${{ secrets.DB_PASSWORD }}

  build-and-deploy:
    needs: [test, deploy-database] # Só roda depois que o teste e a config do banco passarem
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Grant execute permission for Maven Wrapper
      run: chmod +x mvnw

    - name: Build application
      run: ./mvnw clean package -DskipTests

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Enable Google Cloud APIs
      run: |
        gcloud services enable artifactregistry.googleapis.com run.googleapis.com sqladmin.googleapis.com

    - name: Ensure Artifact Registry Repo Exists
      run: |
        if ! gcloud artifacts repositories describe $SERVICE_NAME --location=$GCP_REGION >/dev/null 2>&1; then
          gcloud artifacts repositories create $SERVICE_NAME \
            --repository-format=docker \
            --location=$GCP_REGION \
            --description="Docker repository for $SERVICE_NAME API"
        fi

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker to use gcloud as credential helper
      run: gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -t ${{ env.IMAGE_URL }}:$GITHUB_SHA .
        docker tag ${{ env.IMAGE_URL }}:$GITHUB_SHA ${{ env.IMAGE_URL }}:latest

    - name: Push Docker image to Artifact Registry
      run: |
        docker push ${{ env.IMAGE_URL }}:$GITHUB_SHA
        docker push ${{ env.IMAGE_URL }}:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image ${{ env.IMAGE_URL }}:$GITHUB_SHA \
          --platform managed \
          --region $GCP_REGION \
          --allow-unauthenticated \
          --set-env-vars="SPRING_PROFILES_ACTIVE=prod" \
          --set-env-vars="DB_URL=${{ secrets.DB_URL }}" \
          --set-env-vars="DB_USERNAME=${{ secrets.DB_USERNAME }}" \
          --set-env-vars="DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
          --set-env-vars="CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" \
          --memory=1Gi \
          --cpu=1 \
          --max-instances=10 \
          --timeout=300s

    - name: Get Cloud Run URL
      id: deploy
      run: |
        URL=$(gcloud run services describe $SERVICE_NAME --platform managed --region $GCP_REGION --format 'value(status.url)')
        echo "url=$URL" >> $GITHUB_OUTPUT
        echo "Service deployed at: $URL"